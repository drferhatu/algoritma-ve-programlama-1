name: GitHub Pages'e dağıt

# Her push'ta Java defterleri (Jupyter + IJava) çalıştırılır, gömülü HTML görünümleri
# üretilir ve site derlenip yayımlanır. IJava kernel'i kurulamazsa build_notebooks.py
# çalıştırmayı atlar ve defterdeki mevcut çıktıları kullanır.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * 5'   # her Cuma 16.15 TR: dersten sonra defter çıktılarını açmak için yeniden derle

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  IJAVA_VERSION: 1.3.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Java 21 + Jupyter + IJava kernel -------------------------------------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-notebooks.txt
      - run: pip install -r scripts/requirements-notebooks.txt

      - name: IJava kernel'ini kur
        # Kurulum başarısız olursa iş akışı durmaz; defterler mevcut çıktılarıyla çevrilir.
        continue-on-error: true
        run: |
          curl -sSL -o ijava.zip "https://github.com/SpencerPark/IJava/releases/download/v${IJAVA_VERSION}/ijava-${IJAVA_VERSION}.zip"
          mkdir -p ijava && unzip -q ijava.zip -d ijava
          python ijava/install.py --sys-prefix
          jupyter kernelspec list

      - name: Defterleri çalıştır ve HTML'e çevir
        run: python scripts/build_notebooks.py --execute

      # --- Site ------------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: İçerik doğrulaması
        run: python scripts/validate_content.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
